### This config file contains required core defaults that must be set, along with a handful of common optional settings.
### For a full list of available settings, see https://microsoft.github.io/graphrag/config/yaml/

### LLM settings ###
## There are a number of settings to tune the threading and token limits for LLM calls - check the docs.

models:
  default_chat_model:
    type: openai_chat
    api_base: https://api.siliconflow.cn/v1
    auth_type: api_key
    api_key: ${GRAPHRAG_API_KEY}
    model: THUDM/GLM-4-9B-0414
    encoding_model: cl100k_base
    model_supports_json: true
    concurrent_requests: 3  # Further reduced to avoid rate limiting
    async_mode: threaded
    retry_strategy: native
    max_retries: 10
    tokens_per_minute: 20000
    requests_per_minute: 500
    temperature: 0.0  # Zero temperature for consistent JSON output
    max_output_tokens: 2048  # Increased for longer responses
  default_embedding_model:
    type: openai_embedding
    api_base: https://api.siliconflow.cn/v1
    auth_type: api_key
    api_key: ${GRAPHRAG_API_KEY}
    model: BAAI/bge-m3
    encoding_model: cl100k_base
    model_supports_json: false
    concurrent_requests: 5
    async_mode: threaded
    retry_strategy: native
    max_retries: 10
    tokens_per_minute: 20000
    requests_per_minute: 500
  fast_extractor_model:
    # Use a smaller / faster model here if available on your provider for extraction only.
    # Replace model name below with a lighter variant (e.g. Qwen/Qwen3-1.8B or similar) once confirmed.
    type: openai_chat
    api_base: https://api.siliconflow.cn/v1
    auth_type: api_key
    api_key: ${GRAPHRAG_API_KEY}
    model: THUDM/GLM-4-9B-0414
    encoding_model: cl100k_base
    model_supports_json: true
    temperature: 0
    max_output_tokens: 512
    concurrent_requests: 8
    async_mode: threaded
    retry_strategy: native
    max_retries: 10
    tokens_per_minute: 25000
    requests_per_minute: 600

### Input settings ###

input:
  storage:
    type: file # or blob
    base_dir: "input"
  file_type: text # [csv, text, json]
  

chunks:
  size: 2000       # Larger chunk => fewer LLM calls
  overlap: 50       # Reduced overlap to cut duplication
  group_by_columns: [id]

### Output/storage settings ###
## If blob storage is specified in the following four sections,
## connection_string and container_name must be provided

output:
  type: file # [file, blob, cosmosdb]
  base_dir: "output"
    
cache:
  type: file # [file, blob, cosmosdb]
  base_dir: "cache"

reporting:
  type: file # [file, blob, cosmosdb]
  base_dir: "logs"

vector_store:
  default_vector_store:
    type: lancedb
    db_uri: output\lancedb
    container_name: default
    overwrite: True

### Workflow settings ###

embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store

extract_graph:
  model_id: fast_extractor_model   # Use the faster model for extraction
  prompt: "prompts/extract_graph.txt"
  entity_types: [organization,person,geo,event]
  max_gleanings: 1

summarize_descriptions:
  model_id: default_chat_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english # [regex_english, syntactic_parser, cfg]

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  model_id: default_chat_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  model_id: default_chat_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

embed_graph:
  enabled: false # if true, will generate node2vec embeddings for nodes

umap:
  enabled: false # if true, will generate UMAP embeddings for nodes (embed_graph must also be enabled)

snapshots:
  graphml: false
  embeddings: false

### Query settings ###
## The prompt locations are required here, but each search method has a number of optional knobs that can be tuned.
## See the config docs: https://microsoft.github.io/graphrag/config/yaml/#query

local_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"
  max_context_tokens: 4000  # Reduced for token limit issues
  text_unit_prop: 0.5  # Reduced text proportion
  community_prop: 0.1  # Reduced to ensure community records

global_search:
  chat_model_id: default_chat_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"
  # Reduced limits for shorter one paragraph response
  max_context_tokens: 3000       # Reduced for shorter response
  data_max_tokens: 3000
  map_max_length: 150            # Shorter individual map answer size
  reduce_max_length: 200         # Much shorter final merged answer size
  dynamic_search_threshold: 1    # keep default threshold
  dynamic_search_num_repeats: 1  # single pass
  dynamic_search_use_summary: false
  dynamic_search_keep_parent: false
  dynamic_search_max_level: 2

drift_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_search_reduce_prompt.txt"
  concurrency: 1  # Very conservative concurrency for GLM-4
  primer_folds: 1  # Reduce to minimize token usage
  data_max_tokens: 800  # Reduced for shorter response
  reduce_max_tokens: 300  # Much shorter reduce phase for one paragraph
  primer_llm_max_tokens: 800  # Match data_max_tokens
  n_depth: 1  # Reduce depth to minimize API calls
  local_search_max_data_tokens: 800  # Match data_max_tokens
  local_search_text_unit_prop: 0.6  # Balanced text focus
  local_search_community_prop: 0.1  # Reduce community context
  drift_k_followups: 2  # Minimal follow-ups for shorter response

basic_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
